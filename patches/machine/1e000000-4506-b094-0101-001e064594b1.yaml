metadata:
    namespace: default
    type: ConfigPatches.omni.sidero.dev
    id: 500-1e000000-4506-b094-0101-001e064594b1
    labels:
      omni.sidero.dev/machine: 1e000000-4506-b094-0101-001e064594b1
    annotations:
      description: odroid node 2 config
      name: 500-1e000000-4506-b094-0101-001e064594b1-machine-patch
spec:
  data: |-
    machine:
      network:
        interfaces:
          - interface: bond0
            bond:
              interfaces:
                - enp1s0
                - enp2s0
              mode: active-backup
              miimon: 100
          - interface: br-ext
            bridge:
              interfaces:
                - bond0
              vlan:
                vlanFiltering: true
            dhcp: true
          - interface: ceph0
            addresses:
              - 10.10.0.2/16
      sysctls:
        net/ipv6/conf/bond0/disable_ipv6: "1"
        net/ipv6/conf/br-ext/disable_ipv6: "1"
        net/ipv6/conf/net0/disable_ipv6: "1"
        net/ipv6/conf/net1/disable_ipv6: "1"
        net/ipv6/conf/ceph0/disable_ipv6: "1"
